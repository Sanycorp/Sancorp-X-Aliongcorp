name: el_tzy
description: "EL TZY — AEGIS-M mecha audio forge. Slowed, reverb, 8D, bass and mastering, 100% offline on-device."
publish_to: "none"
version: 7.0.0+70

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Audio DSP core (FFmpeg 8.x audio build: lame/vorbis/opus/soxr/arnndn).
  ffmpeg_kit_flutter_new_audio: ">=2.5.2 <3.0.0"
  # SAF file picking — no storage permission required.
  file_picker: ">=8.1.4 <11.0.0"
  path_provider: ">=2.1.4 <3.0.0"
  # Preview transport.
  audioplayers: ">=6.1.0 <7.0.0"
  shared_preferences: ">=2.2.2 <3.0.0"
  # Provenance manifest hash.
  crypto: ">=3.0.3 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/rnnoise/
    - assets/fonts/
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
