name: probe

# Verifies the deployed origin after every push to the arena branch and on
# demand. No secrets required: everything here is what an anonymous visitor —
# or an attacker — can already see.
#
# Only pushes that touch build inputs are graded. Deployments are created by
# hand from the connector, so a docs/CI push never has one to wait for; the gate
# turns those runs into a no-op instead of a four-minute timeout.
#
# A red run opens (or bumps) a labelled issue, so a broken deploy surfaces as a
# notification instead of a log nobody opens.
#
#   gh workflow run probe.yml

on:
  push:
    branches: ['arena/**']
    # Doc-only pushes should not grade a deployment that was never created.
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/probe-prod.mjs'
      - '.vercel-url'
      - '.github/workflows/probe.yml'
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to probe
        required: false
        default: https://sanayacorp-aegismusic.vercel.app

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs the pushed range, which needs the parent commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether this push can change production
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no usable range: grading"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER" -- \
            'src/**' 'api/**' 'public/**' 'index.html' 'vercel.json' \
            'package.json' 'package-lock.json' 'tools/probe-prod.mjs' || true)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "build inputs changed:"
            echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no build inputs in this push: nothing to grade"
          fi

      - name: Wait for this commit to be live
        if: steps.gate.outputs.run == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          origin="${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}"
          short=$(printf '%.7s' "$SHA")
          echo "waiting for $short on $origin"
          for attempt in $(seq 1 24); do
            body=$(curl -s "$origin/api/health" || true)
            echo "attempt $attempt → $body"
            case "$body" in
              *"\"commit\":\"$short\""*) echo "live: $short"; exit 0 ;;
            esac
            # Deployments are created by hand, one per release. A push that was
            # superseded by a newer commit can never go live, so grading it would
            # fail forever; if the live commit is a descendant of this one, the
            # newer build already contains these changes.
            live=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([0-9a-f]\{7,40\}\)".*/\1/p')
            if [ -n "$live" ] && git cat-file -e "${live}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$SHA" "$live"; then
                echo "superseded: $short is an ancestor of the live $live — nothing to grade"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "deployment for $short did not answer in time" >&2
          exit 1

      - name: Probe
        if: steps.gate.outputs.run == 'true'
        run: node tools/probe-prod.mjs "${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}"

      - name: Raise an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Production probe failing'
          body=$(printf '%s\n\n**Origin:** %s\n**Commit:** `%.7s`\n**Run:** %s\n' \
            'The anonymous probe of the live origin failed. The run summary lists every check and its detail.' \
            "$ORIGIN" "$SHA" "$RUN")

          gh label create monitor --color B60205 --description 'Automated production checks' --force >/dev/null 2>&1 || true

          existing=$(gh issue list --label monitor --state open --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label monitor
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production probe"
            echo ""
            echo "Origin: \`${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}\`"
            echo "Graded: **${{ steps.gate.outputs.run == 'true' && 'yes' || 'no — no build inputs in this push' }}**"
            echo "Commit: `${{ github.sha }}`"
            echo "Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
