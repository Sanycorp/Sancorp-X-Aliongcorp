name: probe

# Verifies the deployed origin after every push to the arena branch and on
# demand. No secrets required: everything here is what an anonymous visitor —
# or an attacker — can already see.
#
# A red run opens (or bumps) a labelled issue, so a broken deploy surfaces as a
# notification instead of a log nobody opens.
#
#   gh workflow run probe.yml

on:
  push:
    branches: ['arena/**']
    # Doc-only pushes should not grade a deployment that was never created.
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/probe-prod.mjs'
      - '.vercel-url'
      - '.github/workflows/probe.yml'
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to probe
        required: false
        default: https://sanayacorp-aegismusic.vercel.app

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for this commit to be live
        env:
          SHA: ${{ github.sha }}
        run: |
          origin="${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}"
          short=$(printf '%.7s' "$SHA")
          echo "waiting for $short on $origin"
          for attempt in $(seq 1 24); do
            body=$(curl -s "$origin/api/health" || true)
            echo "attempt $attempt → $body"
            case "$body" in
              *"\"commit\":\"$short\""*) echo "live: $short"; exit 0 ;;
            esac
            sleep 10
          done
          echo "deployment for $short did not answer in time" >&2
          exit 1

      - name: Probe
        run: node tools/probe-prod.mjs "${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}"

      - name: Raise an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: ${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Production probe failing'
          body=$(printf '%s\n\n**Origin:** %s\n**Commit:** `%.7s`\n**Run:** %s\n' \
            'The anonymous probe of the live origin failed. The run summary lists every check and its detail.' \
            "$ORIGIN" "$SHA" "$RUN")

          gh label create monitor --color B60205 --description 'Automated production checks' --force >/dev/null 2>&1 || true

          existing=$(gh issue list --label monitor --state open --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label monitor
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production probe"
            echo ""
            echo "Origin: \`${{ inputs.origin || 'https://sanayacorp-aegismusic.vercel.app' }}\`"
            echo "Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
