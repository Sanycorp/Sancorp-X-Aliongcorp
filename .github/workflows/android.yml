name: android

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Harden Android manifest
        run: node tools/android-harden.mjs

      - name: Launcher icons
        run: node tools/make-icons.mjs

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-m-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  probe:
    name: Probe deployed web build
    # The target lives in .vercel-url so it is reviewable in git. When the file
    # is absent or still a placeholder the job exits cleanly instead of failing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        run: |
          set -euo pipefail
          url=$(head -n1 .vercel-url 2>/dev/null | tr -d '[:space:]' || true)
          if [ -z "$url" ] || [ "${url#https://}" = "$url" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no usable .vercel-url — probe skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch head and headers
        if: steps.target.outputs.skip == 'false'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          echo "== $URL =="
          code=$(curl -sS -o /tmp/index.html -D /tmp/headers.txt -w '%{http_code}' "$URL/")
          echo "status: $code"
          cat /tmp/headers.txt
          echo "--- body head ---"
          head -c 400 /tmp/index.html; echo
          curl -sS -o /tmp/probe.bin -w 'probe.bin status:%{http_code} bytes:%{size_download}\n' "$URL/probe.bin" || true
          test -s /tmp/probe.bin && { echo "probe.bin hex:"; xxd /tmp/probe.bin | head -2; } || echo "no probe.bin at root"
          if [ "$code" != "200" ]; then
            echo "::error title=root-status::status=$code"
            echo "::error title=root-body::$(head -c 160 /tmp/index.html | tr '\n' ' ' | tr -d '\r')"
            echo "::error title=root-headers::$(grep -iE '^(server|x-vercel|www-authenticate|set-cookie|location):' /tmp/headers.txt | tr '\n' '|' | head -c 200)"
            exit 1
          fi

      - name: Assert security headers
        if: steps.target.outputs.skip == 'false'
        run: |
          set -euo pipefail
          h=/tmp/headers.txt
          for key in content-security-policy strict-transport-security cross-origin-opener-policy cross-origin-embedder-policy x-content-type-options referrer-policy permissions-policy; do
            grep -qi "^$key:" "$h" || { echo "missing: $key"; exit 1; }
            echo "ok: $key"
          done
          grep -qi "require-trusted-types-for 'script'" "$h"
          grep -qi "frame-ancestors 'none'" "$h"
          echo "CSP ok"

      - name: Assert shell assets
        if: steps.target.outputs.skip == 'false'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          for path in /sw.js /boot.css /manifest.webmanifest /.well-known/security.txt /icons/icon-512.png; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

      - name: Verify SRI against served bytes
        if: steps.target.outputs.skip == 'false'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          python3 - "$URL" <<'PY'
          import base64, hashlib, re, subprocess, sys, urllib.parse

          base = sys.argv[1]
          html = open('/tmp/index.html', encoding='utf-8').read()
          checked = 0
          for tag in re.findall(r'<(?:script|link)\b[^>]*>', html):
              m = re.search(r'integrity="sha384-([^"]+)"', tag)
              if not m:
                  continue
              ref = re.search(r'(?:src|href)="([^"]+)"', tag).group(1)
              url = urllib.parse.urljoin(base + '/', ref)
              out = subprocess.run(['curl', '-sS', '--compressed', url], capture_output=True, check=True).stdout
              digest = base64.b64encode(hashlib.sha384(out).digest()).decode()
              ok = digest == m.group(1)
              print(('ok ' if ok else 'MISMATCH ') + ref + f' ({len(out)} bytes)')
              assert ok, ref
              checked += 1
          assert checked >= 2
          print(f'{checked} assets verified')
          PY

      - name: Cache + security.txt policy
        if: steps.target.outputs.skip == 'false'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          ctl=$(curl -sS -I "$URL/sw.js" | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "$ctl"
          echo "$ctl" | grep -qi 'no-store'
          curl -sS "$URL/.well-known/security.txt" | grep -qi '^Contact:'
          echo "ok"
